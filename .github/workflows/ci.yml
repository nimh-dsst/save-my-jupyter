name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
      - run: uv sync --group dev
      - run: ruff format --check .
      - run: uv run ruff check save_my_jupyter tests scripts/selenium_smoke.py
      - run: uv run ty check save_my_jupyter tests
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:lib

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
      - run: uv sync --group dev
      - run: npm run build
      - run: uv run python -m build --wheel --sdist
