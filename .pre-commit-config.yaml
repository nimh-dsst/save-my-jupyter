repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.2
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: local
    hooks:
      - id: ty-check
        name: ty check
        entry: uv run ty check save_my_jupyter tests
        language: system
        pass_filenames: false
      - id: npm-lint
        name: npm lint
        entry: npm run lint
        language: system
        pass_filenames: false
      - id: npm-typecheck
        name: npm typecheck
        entry: npm run typecheck
        language: system
        pass_filenames: false
      - id: npm-test
        name: npm test
        entry: npm test
        language: system
        pass_filenames: false
